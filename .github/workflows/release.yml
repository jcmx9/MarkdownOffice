name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must equal v + package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG}" != "v${version}" ]; then
            echo "Tag '${TAG}' does not match package.json version 'v${version}'" >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Package (electron-builder)
        run: npm run dist
        env:
          # Same ad-hoc signing path as CI; needs no secrets.
          CSC_FOR_PULL_REQUEST: 'true'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Notes from CHANGELOG.md instead of GitHub's generated notes (no author/contributor lists).
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-notes.sh "${TAG#v}" CHANGELOG.md > release-notes.md

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: release
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: release
        run: |
          set -euo pipefail
          ls -l
          # Two-space "<hash>  <file>" lines, bare file names: `sha256sum -c` / `shasum -a 256 -c` accept them.
          sha256sum -- *.zip *.AppImage > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: ${{ contains(github.ref_name, '-dev.') }}
          body_path: release-notes.md
          files: |
            release/*.zip
            release/*.AppImage
            release/SHA256SUMS
