version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    target-branch: "dev"
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Typings follow the Node major in use (Node 24), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # scripts/adhoc-sign.mjs signs with the osx-sign version electron-builder uses (v2 changed the API).
      - dependency-name: "@electron/osx-sign"
        update-types: ["version-update:semver-major"]
    groups:
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*"]
      tooling:
        patterns: ["vite", "electron-vite", "vitest", "@vitest/*", "@biomejs/biome", "typescript", "@playwright/test", "happy-dom", "@types/node"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "dev"
    labels: ["ci", "automated"]
    commit-message:
      prefix: "chore(ci)"
