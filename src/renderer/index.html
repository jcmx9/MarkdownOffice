<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!--
      'wasm-unsafe-eval' only allows compiling WebAssembly (no eval of strings): the preview runs
      Typst's mmdr plugin, the same file the PDF uses, to draw Mermaid diagrams.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' mdo-font:; img-src 'self' data:"
    />
    <title>Markdown Office</title>
  </head>
  <body>
    <div id="app">
      <div id="tabbar" role="tablist"></div>
      <main id="workspace">
        <div id="editor"></div>
        <hr
          id="outline-grip"
          aria-orientation="vertical"
          aria-label="Breite der Gliederung (Doppelklick: Standard)"
          aria-valuemin="10"
          aria-valuemax="40"
          aria-valuenow="18"
          tabindex="0"
          hidden
        />
        <nav id="outline" aria-label="Gliederung" hidden></nav>
        <div id="empty" hidden>
          <!-- Makes what Mod+N makes, a note with the memo header, so the label says so. -->
          <button type="button" data-action="new">Neues Memo …</button>
          <button type="button" data-action="open">Öffnen …</button>
        </div>
      </main>
      <footer id="status"></footer>
      <footer id="infoline" hidden></footer>
    </div>
    <div id="notices" aria-live="polite"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
